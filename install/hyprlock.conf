# Minimal portable hyprlock config for the power menu's Lock entry.
# Replace the colors (or add a background path) if you want something else.
# The shell does not generate this file: it only runs `hyprlock`.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(20, 18, 24, 1.0)
}

input-field {
    monitor =
    size = 240, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    placeholder_text = Password…
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 72
    font_family = Google Sans
    position = 0, 100
    halign = center
    valign = center
}
